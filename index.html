<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Armados Ripley</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #fff5fa; color: #2b1a26; }
header { background: linear-gradient(120deg, #fd1585, #ff5aa8); color: white; padding: 25px 18px; text-align: center; }
header h1 { margin: 0 0 8px; font-size: 25px; }
header p { margin: 0; }
main { max-width: 650px; margin: 24px auto; padding: 0 15px; }
.panel { background: white; padding: 22px; border-radius: 15px; box-shadow: 0 4px 15px #fd158526; margin-bottom: 18px; }
label { display: block; font-weight: bold; margin-bottom: 9px; }
input[type="text"], input[type="password"] { width: 100%; padding: 14px; border: 1px solid #ffb3d6; border-radius: 9px; font-size: 17px; margin-bottom: 12px; }
input[type="file"] { width: 100%; padding: 12px; border: 2px dashed #fd1585; border-radius: 9px; background: #fff0f7; font-size: 15px; margin-bottom: 12px; }
button { border: 0; border-radius: 9px; padding: 13px; font-size: 15px; font-weight: bold; cursor: pointer; }
.primary { background: #fd1585; color: white; width: 100%; }
.secondary { background: #ffe3f1; color: #c2086b; }
.actions { display: flex; gap: 10px; margin-top: 10px; }
.actions button { flex: 1; }
.result { text-align: center; background: #ffeaf4; padding: 22px; border-radius: 12px; margin-top: 18px; }
.result h2 { margin: 5px 0; font-size: 30px; color: #fd1585; }
.result.alerta { background: #fff4e0; }
.result.alerta h2 { color: #b35c00; }
#skuMostrado { overflow-wrap: anywhere; }
.foto { display: block; margin: 0 auto 8px; max-width: 100%; max-height: 240px; object-fit: contain; background: #fff; border-radius: 10px; }
.nombre { font-size: 17px; font-weight: bold; margin: 10px 0 0; line-height: 1.3; }
.enlace { display: inline-block; margin-top: 10px; padding: 10px 16px; background: #ffe3f1; color: #c2086b; border-radius: 9px; font-weight: bold; text-decoration: none; font-size: 14px; }
.small { font-size: 13px; color: #7a5568; line-height: 1.5; }
.hidden { display: none; }
.estado { background: #ffe3f1; color: #c2086b; padding: 10px; border-radius: 9px; text-align: center; font-weight: bold; margin-bottom: 12px; line-height: 1.5; }
.estado.vacio { background: #fff4e0; color: #b35c00; }
h3 { color: #c2086b; margin-top: 0; }
.vozfila { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.vozfila select { flex: 1; min-width: 0; padding: 10px; border: 1px solid #ffb3d6; border-radius: 9px; font-size: 14px; background: #fff; color: #2b1a26; }
</style>
</head>
<body>
<header>
  <h1>CONSULTA DE ARMADOS RIPLEY</h1>
  <p>Busca el SKU y consulta su tipo de armado</p>
</header>

<main>
  <section class="panel">
    <label for="sku">Ingresa el SKU largo</label>
    <input id="sku" type="text" inputmode="numeric" placeholder="Ej.: 2064253284110">
    <button class="primary" onclick="buscar()">🔎 CONSULTAR SKU</button>

    <div class="actions">
      <button class="secondary" onclick="dictar()">🎙️ Dictar SKU</button>
      <button class="secondary" onclick="leerResultado()">🔊 Repetir</button>
    </div>
    <div class="vozfila">
      <span class="small"><b>Voz:</b></span>
      <select id="voz" onchange="cambiarVoz()"></select>
      <button class="secondary" onclick="probarVoz()">▶ Probar</button>
    </div>

    <div id="resultado" class="result hidden" aria-live="polite">
      <img id="foto" class="foto hidden" alt="Foto del producto" referrerpolicy="no-referrer">
      <p id="fotoMsg" class="small"></p>
      <p>SKU consultado</p>
      <strong id="skuMostrado"></strong>
      <p id="nombre" class="nombre"></p>
      <p id="nombreNota" class="small"></p>
      <h2 id="tipo"></h2>
      <p id="detalle"></p>
      <a id="enlace" class="enlace hidden" target="_blank" rel="noopener">🛒 Ver en Ripley.com</a>
    </div>
    <p id="mensaje" class="small"></p>
  </section>

  <section class="panel">
    <h3>📥 Subir archivo</h3>
    <div id="estado" class="estado"></div>

    <div id="zonaClave">
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="off">
      <button class="primary" onclick="entrar()">🔒 Entrar</button>
      <p id="mensajeClave" class="small"></p>
    </div>

    <div id="zonaSubir" class="hidden">
      <input id="archivoExcel" type="file" accept=".xlsx,.xlsm,.xls" onchange="importarExcel(event)">
      <p id="mensajeExcel" class="small"></p>
      <div class="actions">
        <button class="secondary" onclick="mostrarCambio()">🔑 Cambiar contraseña</button>
        <button class="secondary" onclick="bloquear()">Cerrar</button>
      </div>
      <div id="zonaCambio" class="hidden" style="margin-top:12px">
        <input id="claveNueva" type="password" placeholder="Nueva contraseña (mínimo 6 letras)" autocomplete="off">
        <button class="primary" onclick="guardarClave()">Guardar contraseña</button>
        <p id="mensajeCambio" class="small"></p>
      </div>
    </div>
  </section>
</main>

<script>
// <PURO>
function norm(s) {
  return String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase();
}

function valorCelda(hoja, r, c) {
  const cel = hoja[XLSX.utils.encode_cell({ r: r, c: c })];
  if (!cel || cel.t === "e" || cel.v == null) return "";
  return String(cel.v).trim();
}

function leerHoja(hoja) {
  if (!hoja || !hoja["!ref"]) return null;
  const rango = XLSX.utils.decode_range(hoja["!ref"]);
  let filaTitulos = -1;
  let col = {};
  const limite = Math.min(rango.e.r, rango.s.r + 15);
  for (let r = rango.s.r; r <= limite && filaTitulos < 0; r++) {
    const tmp = {};
    for (let c = rango.s.c; c <= rango.e.c; c++) {
      const t = norm(valorCelda(hoja, r, c));
      if (t && tmp[t] === undefined) tmp[t] = c;
    }
    if (tmp["SKU"] !== undefined &&
        (tmp["TIPO DE ARMADO REVISADO"] !== undefined || tmp["TIPO DE ARMADO"] !== undefined)) {
      filaTitulos = r;
      col = tmp;
    }
  }
  if (filaTitulos < 0) return null;

  const datos = {};
  const porCod = {};
  let sinTipo = 0, repetidos = 0;
  const leer = (r, nombre) => col[nombre] === undefined ? "" : valorCelda(hoja, r, col[nombre]);

  for (let r = filaTitulos + 1; r <= rango.e.r; r++) {
    const sku = leer(r, "SKU").replace(/\D/g, "");
    if (!/^\d{8,20}$/.test(sku)) continue;
    let tipo = leer(r, "TIPO DE ARMADO REVISADO") || leer(r, "TIPO DE ARMADO");
    if (!tipo) { tipo = "SIN TIPO ASIGNADO"; sinTipo++; }
    if (datos[sku]) repetidos++;
    datos[sku] = {
      t: tipo,
      n: leer(r, "NOMBRE RIPLEY") || leer(r, "NOMBRE PRODUCTO") || leer(r, "NOMBRE") || leer(r, "DESCRIPCION"),
      m: leer(r, "MODELO"),
      l: leer(r, "LINEA"),
      s: leer(r, "SUBLINEA")
    };
    const cod = leer(r, "COD VARIACION").replace(/\D/g, "");
    if (cod.length >= 6) porCod[cod] = sku;
  }
  return { datos: datos, porCod: porCod, sinTipo: sinTipo, repetidos: repetidos };
}

function procesarLibro(libro) {
  const nombres = libro.SheetNames.slice().sort(function(a, b) {
    return (norm(b) === "MASTER") - (norm(a) === "MASTER");
  });
  for (const nombre of nombres) {
    const r = leerHoja(libro.Sheets[nombre]);
    if (r && Object.keys(r.datos).length > 0) { r.hoja = nombre; return r; }
  }
  return null;
}
// </PURO>

function sha256Hex(texto) {
  const bytes = new TextEncoder().encode(texto);
  const primos = [];
  for (let n = 2; primos.length < 64; n++) {
    let esPrimo = true;
    for (let d = 2; d * d <= n; d++) { if (n % d === 0) { esPrimo = false; break; } }
    if (esPrimo) primos.push(n);
  }
  const K = primos.map(function(p) { return (Math.pow(p, 1 / 3) % 1) * 4294967296 | 0; });
  let H = primos.slice(0, 8).map(function(p) { return (Math.pow(p, 1 / 2) % 1) * 4294967296 | 0; });
  const ror = function(x, n) { return (x >>> n) | (x << (32 - n)); };
  const l = bytes.length;
  const total = ((l + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes);
  buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(l * 8 / 4294967296));
  dv.setUint32(total - 4, (l * 8) >>> 0);
  const w = new Array(64);
  for (let i = 0; i < total; i += 64) {
    for (let j = 0; j < 16; j++) w[j] = dv.getUint32(i + j * 4) | 0;
    for (let j = 16; j < 64; j++) {
      const s0 = ror(w[j - 15], 7) ^ ror(w[j - 15], 18) ^ (w[j - 15] >>> 3);
      const s1 = ror(w[j - 2], 17) ^ ror(w[j - 2], 19) ^ (w[j - 2] >>> 10);
      w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let j = 0; j < 64; j++) {
      const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[j] + w[j]) | 0;
      const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H = [(H[0] + a) | 0, (H[1] + b) | 0, (H[2] + c) | 0, (H[3] + d) | 0,
         (H[4] + e) | 0, (H[5] + f) | 0, (H[6] + g) | 0, (H[7] + h) | 0];
  }
  return H.map(function(x) { return ("00000000" + (x >>> 0).toString(16)).slice(-8); }).join("");
}

const SAL = "ripley-armados:";
const CLAVE_INICIAL_HASH = "60cb43bdd736a5c7a556e0602910fca1bdc60d5fd75139fab8a9270660edaa9b";
let desbloqueado = false;

function claveVigente() {
  try { return localStorage.getItem("claveRipleyHash") || CLAVE_INICIAL_HASH; }
  catch (e) { return CLAVE_INICIAL_HASH; }
}

function entrar() {
  const campo = document.getElementById("clave");
  const msg = document.getElementById("mensajeClave");
  if (sha256Hex(SAL + campo.value) === claveVigente()) {
    desbloqueado = true;
    campo.value = "";
    msg.textContent = "";
    document.getElementById("zonaClave").classList.add("hidden");
    document.getElementById("zonaSubir").classList.remove("hidden");
  } else {
    msg.textContent = "Contraseña incorrecta.";
  }
}

function bloquear() {
  desbloqueado = false;
  document.getElementById("zonaSubir").classList.add("hidden");
  document.getElementById("zonaCambio").classList.add("hidden");
  document.getElementById("zonaClave").classList.remove("hidden");
  document.getElementById("mensajeExcel").textContent = "";
}

function mostrarCambio() {
  document.getElementById("zonaCambio").classList.toggle("hidden");
}

function guardarClave() {
  if (!desbloqueado) return;
  const nueva = document.getElementById("claveNueva").value;
  const msg = document.getElementById("mensajeCambio");
  if (nueva.length < 6) {
    msg.textContent = "Escribe al menos 6 caracteres.";
    return;
  }
  try {
    localStorage.setItem("claveRipleyHash", sha256Hex(SAL + nueva));
    document.getElementById("claveNueva").value = "";
    msg.textContent = "✅ Contraseña cambiada.";
  } catch (e) {
    msg.textContent = "No se pudo guardar la contraseña en este navegador.";
  }
}

let base = {};
let porCod = {};
let info = null;

try {
  const guardado = JSON.parse(localStorage.getItem("armadosRipleyV2") || "null");
  if (guardado && guardado.datos) {
    base = guardado.datos;
    porCod = guardado.porCod || {};
    info = guardado.info || null;
  }
} catch (e) {}

function mostrarEstado() {
  const el = document.getElementById("estado");
  const total = Object.keys(base).length;
  if (!total) {
    el.className = "estado vacio";
    el.textContent = "Todavía no hay datos. Sube tu Excel maestro.";
  } else {
    el.className = "estado";
    el.textContent = "SKU cargados: " + total +
      (info && info.fecha ? " · Última actualización: " + info.fecha : "");
  }
}
mostrarEstado();

function importarExcel(event) {
  const archivo = event.target.files[0];
  const msg = document.getElementById("mensajeExcel");
  if (!archivo) return;
  if (!desbloqueado) {
    msg.textContent = "Ingresa la contraseña para subir archivos.";
    event.target.value = "";
    return;
  }

  if (typeof XLSX === "undefined") {
    msg.textContent = "No se pudo cargar el lector de Excel. Revisa tu internet y recarga la página (F5).";
    return;
  }

  msg.textContent = "Leyendo el archivo...";
  const lector = new FileReader();
  lector.onload = function(e) {
    try {
      const libro = XLSX.read(e.target.result, { type: "array" });
      const r = procesarLibro(libro);
      if (!r) {
        msg.textContent = "No encontré las columnas SKU y TIPO DE ARMADO REVISADO en tu Excel. Revisa que la hoja MASTER tenga esos títulos.";
        return;
      }
      base = r.datos;
      porCod = r.porCod;
      info = { fecha: new Date().toLocaleString("es-PE"), archivo: archivo.name };
      try {
        localStorage.setItem("armadosRipleyV2", JSON.stringify({ datos: base, porCod: porCod, info: info }));
      } catch (err) {
        msg.textContent = "Se leyó el Excel pero no se pudo guardar en el navegador. Revisa la configuración.";
        return;
      }
      msg.textContent = "✅ Se cargaron " + Object.keys(base).length + " SKU desde la hoja " + r.hoja + "." +
        (r.sinTipo ? " ⚠️ " + r.sinTipo + " SKU no tienen tipo asignado en el Excel." : "") +
        (r.repetidos ? " Había " + r.repetidos + " SKU repetidos (se usó el último)." : "");
      mostrarEstado();
      document.getElementById("resultado").classList.add("hidden");
    } catch (err) {
      msg.textContent = "No se pudo leer el archivo. Verifica que sea un Excel (.xlsx) y que no esté dañado.";
    }
    event.target.value = "";
  };
  lector.readAsArrayBuffer(archivo);
}

function limpiarProducto() {
  const foto = document.getElementById("foto");
  foto.classList.add("hidden");
  foto.removeAttribute("src");
  document.getElementById("fotoMsg").textContent = "";
  document.getElementById("nombre").textContent = "";
  document.getElementById("nombreNota").textContent = "";
  document.getElementById("enlace").classList.add("hidden");
}

function mostrarFoto(sku) {
  const foto = document.getElementById("foto");
  const msg = document.getElementById("fotoMsg");
  foto.classList.add("hidden");
  msg.textContent = "Cargando foto...";
  foto.onload = function() {
    foto.classList.remove("hidden");
    msg.textContent = "Foto referencial de Ripley.com";
  };
  foto.onerror = function() {
    foto.classList.add("hidden");
    msg.textContent = "No se pudo cargar la foto. Revisa tu internet o usa el botón Ver en Ripley.com.";
  };
  foto.src = "https://rimage.ripley.com.pe/home.ripley/Attachment/WOP/1/" + sku + "/full_image-" + sku + ".webp";
}

function buscar() {
  const ingreso = document.getElementById("sku").value.replace(/\D/g, "");
  const resultado = document.getElementById("resultado");
  const mensaje = document.getElementById("mensaje");

  if (!/^\d{8,20}$/.test(ingreso)) {
    resultado.classList.add("hidden");
    mensaje.textContent = "Ingresa un SKU numérico válido.";
    return;
  }
  mensaje.textContent = "";

  const clave = base[ingreso] ? ingreso : porCod[ingreso];
  const dato = clave ? base[clave] : null;

  resultado.classList.remove("hidden");
  resultado.classList.remove("alerta");
  textoVoz = "";
  limpiarProducto();
  document.getElementById("skuMostrado").textContent = clave || ingreso;

  if (!Object.keys(base).length) {
    document.getElementById("tipo").textContent = "Sin datos";
    document.getElementById("detalle").textContent = "Primero sube tu Excel maestro en el cuadro de abajo.";
    textoVoz = "Primero sube tu Excel maestro.";
    resultado.classList.add("alerta");
    hablar(textoVoz);
    return;
  }

  if (!dato) {
    document.getElementById("tipo").textContent = "SKU no registrado";
    document.getElementById("detalle").textContent =
      "No está en tu Excel maestro. Si es nuevo, agrégalo al Excel y vuelve a subirlo.";
    textoVoz = "Este SKU no está registrado.";
    resultado.classList.add("alerta");
    hablar(textoVoz);
    return;
  }

  mostrarFoto(clave);
  document.getElementById("nombre").textContent = dato.n || dato.m || "";
  if (!dato.n && dato.m) {
    document.getElementById("nombreNota").textContent = "Nombre según tu Excel maestro";
  }
  const enlace = document.getElementById("enlace");
  enlace.href = "https://simple.ripley.com.pe/search/" + clave;
  enlace.classList.remove("hidden");

  document.getElementById("tipo").textContent = dato.t;
  const linea = [dato.l, dato.s].filter(Boolean).join(" / ");
  let detalle = linea;
  if (dato.t === "SIN TIPO ASIGNADO" || dato.t === "FALTA CONFIRMAR") {
    detalle = "Confirma el tipo de armado antes de utilizarlo." + (detalle ? " " + detalle : "");
    resultado.classList.add("alerta");
  }
  document.getElementById("detalle").textContent = detalle;
  textoVoz = limpiarNombreVoz(dato.n || dato.m) + frasePorTipo(dato.t);
  hablar(textoVoz);
}

function limpiarNombreVoz(nombre) {
  if (!nombre) return "";
  return nombre.toLowerCase().replace(/\+/g, " más ").replace(/\s+/g, " ").trim() + ". ";
}

function frasePorTipo(tipo) {
  const t = String(tipo).toLowerCase().trim();
  if (t === "sin tipo asignado") return "Este producto no tiene tipo de armado asignado. Confírmalo antes de usarlo.";
  if (t === "falta confirmar") return "El tipo de armado todavía falta confirmar.";
  if (t.indexOf("no requiere") === 0) return "No requiere armado.";
  return "Es " + t + ".";
}

let textoVoz = "";
let voces = [];
const MASCULINAS = /pablo|raul|raúl|jorge|diego|juan|carlos|alvaro|álvaro|enrique|miguel|andres|andrés|alonso|tomas|tomás|male/i;
const PREFERIDAS = ["camila", "dalia", "elvira", "paloma", "salome", "salomé", "elena", "sabina", "helena", "laura", "paulina", "google español", "monica", "mónica", "lucia", "lucía"];

function puntajeVoz(v) {
  const n = v.name.toLowerCase();
  let p = 0;
  if (/natural|online/.test(n)) p += 100;
  if (v.lang.toLowerCase().replace("_", "-") === "es-pe") p += 20;
  const i = PREFERIDAS.findIndex(function(x) { return n.indexOf(x) >= 0; });
  if (i >= 0) p += 50 - i;
  if (MASCULINAS.test(n)) p -= 200;
  return p;
}

function cargarVoces() {
  if (!("speechSynthesis" in window)) return;
  const sel = document.getElementById("voz");
  voces = window.speechSynthesis.getVoices().filter(function(v) {
    return v.lang.toLowerCase().indexOf("es") === 0;
  });
  voces.sort(function(a, b) { return puntajeVoz(b) - puntajeVoz(a); });
  sel.innerHTML = "";
  if (!voces.length) {
    const o = document.createElement("option");
    o.textContent = "Voz del sistema";
    sel.appendChild(o);
    return;
  }
  voces.forEach(function(v) {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name.replace("Microsoft ", "") + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  let guardada = "";
  try { guardada = localStorage.getItem("vozRipley") || ""; } catch (e) {}
  if (guardada && voces.some(function(v) { return v.name === guardada; })) sel.value = guardada;
}

if ("speechSynthesis" in window) {
  cargarVoces();
  window.speechSynthesis.onvoiceschanged = cargarVoces;
}

function cambiarVoz() {
  try { localStorage.setItem("vozRipley", document.getElementById("voz").value); } catch (e) {}
  probarVoz();
}

function probarVoz() {
  hablar("Hola, soy tu asistente de armados Ripley.");
}

function hablar(texto) {
  if (!("speechSynthesis" in window)) {
    alert("Tu navegador no admite lectura en voz alta.");
    return;
  }
  window.speechSynthesis.cancel();
  const voz = new SpeechSynthesisUtterance(texto);
  const elegida = voces.find(function(v) { return v.name === document.getElementById("voz").value; });
  if (elegida) { voz.voice = elegida; voz.lang = elegida.lang; }
  else { voz.lang = "es-PE"; }
  voz.rate = 0.95;
  voz.pitch = 1.05;
  window.speechSynthesis.speak(voz);
}

function leerResultado() {
  if (!textoVoz || document.getElementById("resultado").classList.contains("hidden")) {
    alert("Primero consulta un SKU.");
    return;
  }
  hablar(textoVoz);
}

function dictar() {
  const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Reconocimiento) {
    alert("El dictado puede no estar disponible en este navegador. Prueba Chrome.");
    return;
  }
  const reconocimiento = new Reconocimiento();
  reconocimiento.lang = "es-PE";
  reconocimiento.onresult = function(event) {
    const texto = event.results[0][0].transcript;
    const sku = texto.replace(/\D/g, "");
    document.getElementById("sku").value = sku;
    if (sku) buscar();
    else alert("No se reconocieron números. Intenta dictar nuevamente.");
  };
  reconocimiento.onerror = function() {
    alert("No se pudo reconocer la voz. Revisa el permiso del micrófono.");
  };
  reconocimiento.start();
}

document.getElementById("sku").addEventListener("keydown", function(event) {
  if (event.key === "Enter") buscar();
});
document.getElementById("clave").addEventListener("keydown", function(event) {
  if (event.key === "Enter") entrar();
});
</script>
</body>
